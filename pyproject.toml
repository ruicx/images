[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-image-repository"
version = "0.1.0"
description = "Manifest-driven tooling for development container images"
requires-python = ">=3.11"
dependencies = [
  "image-kit==0.1.0",
]

[project.optional-dependencies]
dev = [
  "image-kit[dev]==0.1.0",
]

[tool.uv.sources]
image-kit = { path = "vendor/image-kit", editable = true }

[tool.image-kit]
registry = "ghcr.io"
cache = "gha"
rebuild-inputs = [".gitmodules", "vendor/image-kit", "tools/**"]
shell-inputs = ["vendor/image-kit/tests/*.sh"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests", "vendor/image-kit/tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

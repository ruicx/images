exclude: ^vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^(\.vscode/|\.devcontainer.*\.json|.*\.jsonc)$
      - id: check-toml
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-symlinks
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: check-added-large-files
        args: [--maxkb=100]
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra dev ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run --locked --extra dev ty check
        language: system
        pass_filenames: false
        always_run: true

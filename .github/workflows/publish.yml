name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      family:
        description: YAML image name; leave empty to select all or use target
        required: false
        type: string
      target:
        description: Exact name/variant; mutually exclusive with family
        required: false
        type: string

permissions:
  contents: read

# Serialize active publishers while keeping PR validation independent.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publisher' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  plan:
    name: Validate and plan
    runs-on: ubuntu-24.04
    outputs:
      has_build: ${{ steps.plan.outputs.has_build }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install tooling
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check tooling and contracts
        run: |
          python -m ruff check tools
          python -m ruff format --check tools
          python -m ty check
          python -m pytest
          python -m image_kit validate
          python -m tools.check_repository
          python -m pytest vendor/image-kit/tests
          bash vendor/image-kit/tests/install-arguments.sh
          bash vendor/image-kit/tests/ascend-pip-check.sh
      - name: Calculate affected images
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_FAMILY: ${{ inputs.family }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          arguments=(--all)
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git merge-base "$PR_BASE" "$HEAD_SHA")"
            arguments=(--base "$base" --head "$HEAD_SHA")
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$INPUT_FAMILY" && -n "$INPUT_TARGET" ]]; then
              echo "Choose family or target, not both" >&2
              exit 2
            fi
            if [[ -n "$INPUT_TARGET" ]]; then
              arguments=(--target "$INPUT_TARGET")
            elif [[ -n "$INPUT_FAMILY" ]]; then
              arguments=(--family "$INPUT_FAMILY")
            fi
          elif [[ "$EVENT_NAME" == push && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            arguments=(--base "$BEFORE_SHA" --head "$HEAD_SHA")
          fi
          python -m image_kit plan "${arguments[@]}" \
            --output build-plan.json --github-output "$GITHUB_OUTPUT"
          echo "revision=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          cat build-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-plan-${{ github.run_attempt }}
          path: build-plan.json
          if-no-files-found: error

  verify-pr:
    name: PR (${{ matrix.worker_id }})
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.has_build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      component: ${{ matrix.component }}
      worker_id: ${{ matrix.worker_id }}
      revision: ${{ needs.plan.outputs.revision }}
      publish: false

  build-publish:
    name: Publish (${{ matrix.worker_id }})
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.has_build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      component: ${{ matrix.component }}
      worker_id: ${{ matrix.worker_id }}
      revision: ${{ needs.plan.outputs.revision }}
      publish: true

  merge:
    name: Merge manifests and advance tags
    needs: [plan, build-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.plan.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv sync --locked --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: build-plan-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*-${{ github.run_attempt }}
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check complete architecture set and merge
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_REVISION: ${{ needs.plan.outputs.revision }}
          IMAGE_REF: ${{ github.ref }}
          IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          python -m image_kit merge --plan build-plan.json \
            --owner "$IMAGE_OWNER" --revision "$IMAGE_REVISION" \
            --build-id "$IMAGE_BUILD_ID" --repository "$IMAGE_REPOSITORY" \
            --digests digests --ref "$IMAGE_REF" --output publication.json
      - name: Save verified publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.run_attempt }}
          path: publication.json
          if-no-files-found: error
          retention-days: 90

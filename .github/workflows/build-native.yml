name: Native image build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      component:
        type: string
        required: true
      worker_id:
        type: string
        required: true
      revision:
        type: string
        required: true
      publish:
        type: boolean
        required: true

# Permissions are inherited from the caller: PRs receive contents:read only.
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_REPOSITORY: ${{ github.repository }}
      IMAGE_REVISION: ${{ inputs.revision }}
      IMAGE_PLATFORM: ${{ inputs.platform }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_COMPONENT: ${{ inputs.component }}
      IMAGE_WORKER: ${{ inputs.worker_id }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv sync --locked --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: build-plan-${{ github.run_attempt }}
      - name: Free disk space for CUDA builds
        shell: bash
        run: |
          df -h /
          # Installation happens inside the images. These hosted-runner SDKs
          # are unused; retain Python, Node, Docker and the checked-out inputs.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          # Run before creating the builder so its image/cache is preserved.
          docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
        with:
          # Each worker builds one dependency component on its native architecture.
          # Limit installation concurrency within the component.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - name: Expose Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - name: Render current commit for tests
        run: |
          python -m image_kit bake --plan build-plan.json \
            --owner "$IMAGE_OWNER" --repository "$IMAGE_REPOSITORY" \
            --revision "$IMAGE_REVISION" --build-id "$IMAGE_BUILD_ID" --platform "$IMAGE_PLATFORM" --component "$IMAGE_COMPONENT" \
            --mode load --github-cache --output docker-bake.load.json
      - name: Build and test independent graph components
        run: |
          python -m image_kit build-test --plan build-plan.json --bake docker-bake.load.json \
            --owner "$IMAGE_OWNER" --repository "$IMAGE_REPOSITORY" \
            --revision "$IMAGE_REVISION" --build-id "$IMAGE_BUILD_ID" \
            --platform "$IMAGE_PLATFORM" --component "$IMAGE_COMPONENT" --github-cache
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Render publication graph
        if: inputs.publish
        run: |
          python -m image_kit bake --plan build-plan.json \
            --owner "$IMAGE_OWNER" --repository "$IMAGE_REPOSITORY" \
            --revision "$IMAGE_REVISION" --build-id "$IMAGE_BUILD_ID" --platform "$IMAGE_PLATFORM" --component "$IMAGE_COMPONENT" \
            --mode publish --github-cache --output docker-bake.publish.json
      - name: Push selected images by digest
        id: publish
        uses: docker/bake-action@v6
        if: inputs.publish
        with:
          source: .
          files: docker-bake.publish.json
      - name: Collect publication digests
        if: inputs.publish
        run: |
          # Provenance for the whole graph can exceed Linux's per-variable
          # exec limit. Serialize it into this script, then write via stdin.
          # toJSON supplies a JS string literal; the quoted heredoc prevents
          # shell expansion of metadata contents.
          node <<'WRITE_BUILD_METADATA'
          const fs = require('node:fs');
          fs.writeFileSync('build-metadata.json', ${{ toJSON(steps.publish.outputs.metadata) }});
          WRITE_BUILD_METADATA
          python -m image_kit collect --plan build-plan.json \
            --owner "$IMAGE_OWNER" --revision "$IMAGE_REVISION" --build-id "$IMAGE_BUILD_ID" \
            --repository "$IMAGE_REPOSITORY" --platform "$IMAGE_PLATFORM" --component "$IMAGE_COMPONENT" --metadata build-metadata.json \
            --output "digests/$IMAGE_WORKER.json"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: digests-${{ inputs.worker_id }}-${{ github.run_attempt }}
          path: digests/*.json
          if-no-files-found: error
      - name: Report disk usage
        if: always()
        shell: bash
        run: |
          df -h /
          docker system df
      - name: Save generated configuration and metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output-${{ inputs.worker_id }}-${{ github.run_attempt }}
          path: |
            docker-bake*.json
            build-metadata*.json
          if-no-files-found: warn

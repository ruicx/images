name: Pull request images

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_PLATFORM: ${{ matrix.platform }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"

      - name: Install validation dependencies
        run: |
          uv sync --locked --extra dev --python 3.12
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Validate code and manifests
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync ty check
          uv run --no-sync pytest
          uv run --no-sync images validate
          uv run --no-sync python -m tools.check_repository
          mapfile -t shell_files < <(uv run --no-sync images files --kind shell)
          shellcheck "${shell_files[@]}"
          shfmt -d -i 4 -ci "${shell_files[@]}"
          bash vendor/image-kit/tests/install-arguments.sh
          bash vendor/image-kit/tests/ascend-pip-check.sh

      - name: Calculate affected images
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            uv run --no-sync images plan --base "$BASE_SHA" --head "$HEAD_SHA" --platform "$IMAGE_PLATFORM" --output build-plan.json
          else
            uv run --no-sync images plan --all --platform "$IMAGE_PLATFORM" --output build-plan.json
          fi
          count="$(python -c 'import json; print(len(json.load(open("build-plan.json"))["targets"]))')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat build-plan.json

      - name: Set up Docker Buildx
        if: steps.plan.outputs.count != '0'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Render pull-request Bake graph
        if: steps.plan.outputs.count != '0'
        env:
          IMAGE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run --no-sync images bake \
            --plan build-plan.json \
            --owner "${{ github.repository_owner }}" \
            --repository "${{ github.repository }}" \
            --revision "$IMAGE_REVISION" \
            --build-id "$IMAGE_BUILD_ID" \
            --mode load \
            --output docker-bake.generated.json
          uv run --no-sync images build-test \
            --plan build-plan.json \
            --bake docker-bake.generated.json \
            --owner "${{ github.repository_owner }}" \
            --revision "$IMAGE_REVISION" \
            --build-id "$IMAGE_BUILD_ID"

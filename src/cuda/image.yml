schema_version: 1
name: cuda
description: Parameterized NVIDIA CUDA development images for Linux amd64.
dockerfile: src/cuda/Dockerfile
context: .
platforms:
  - linux/amd64
inputs:
  - src/_scripts/system.sh
  - src/_scripts/dev-tools.sh
  - src/_scripts/cmake.sh
  - src/_scripts/llama-cpp.sh
  - src/_scripts/devshell.sh
  - src/_scripts/user.sh
  - src/_scripts/ssh.sh
  - src/_scripts/workspace.sh
  - src/_scripts/finalize-mirror.sh
  - src/_assets/docker-entrypoint.sh
runtime:
  ssh:
    default: password
    login_user: root
publish: true
variants:
  - id: 12.6.3-devel-ubuntu24.04
    base:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
      digest: sha256:392c0df7b577ecae17a17f6ba7f2009c217bb4422f8431c053ae9af61a8c148a
    build_args:
      DEFAULT_USER: root
      DEVSHELL: true
      TZ: Asia/Shanghai
      CMAKE_VERSION: 4.3.2
      LLAMA_CPP_VERSION: b11046
      LLAMA_CPP_CUDA_VERSION: "12.8"
      WORKSPACE_DIR: /work
    mirror: upstream
    dependencies: []
    tests:
      - src/cuda/tests/smoke.sh
  - id: 12.8.2-devel-ubuntu24.04
    base:
      image: nvidia/cuda:12.8.2-devel-ubuntu24.04
      digest: null
    build_args:
      DEFAULT_USER: root
      DEVSHELL: true
      TZ: Asia/Shanghai
      CMAKE_VERSION: 4.3.2
      LLAMA_CPP_VERSION: b11046
      LLAMA_CPP_CUDA_VERSION: "12.8"
      WORKSPACE_DIR: /work
    mirror: upstream
    dependencies: []
    tests:
      - src/cuda/tests/smoke.sh

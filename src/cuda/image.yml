schema_version: 1
name: cuda
description: Parameterized NVIDIA CUDA development images for Linux amd64.
dockerfile: src/cuda/Dockerfile
context: .
platforms:
  - linux/amd64
inputs:
  - src/_scripts/system/system.sh
  - src/_scripts/dev/dev-tools.sh
  - src/_scripts/python/python-install.sh
  - src/_scripts/dev/cmake.sh
  - src/_scripts/python/cuda-pip-packages.sh
  - src/_assets/python-dev-requirements.txt
  - src/_scripts/dev/devshell.sh
  - src/_scripts/system/user.sh
  - src/_scripts/system/ssh.sh
  - src/_scripts/system/workspace.sh
  - src/_scripts/system/finalize-mirror.sh
  - src/_assets/docker-entrypoint.sh
publish: true
variants:
  - id: 12.6.3-devel-ubuntu24.04
    base:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
      digest: null
    build_args:
      DEFAULT_USER: luciole
      DEFAULT_UID: 1000
      DEFAULT_GID: 1000
      DEFAULT_GROUPS: ""
      DEVSHELL: true
      TZ: Asia/Shanghai
      CMAKE_VERSION: 4.3.2
      WORKSPACE_DIR: /work
    mirror: upstream
    runtime:
      ssh:
        mode: password
    dependencies: []
    tests:
      - src/cuda/tests/smoke.sh
  - id: 12.8.2-devel-ubuntu24.04
    base:
      image: nvidia/cuda:12.8.2-devel-ubuntu24.04
      digest: null
    build_args:
      DEFAULT_USER: luciole
      DEFAULT_UID: 1000
      DEFAULT_GID: 1000
      DEFAULT_GROUPS: ""
      DEVSHELL: true
      TZ: Asia/Shanghai
      CMAKE_VERSION: 4.3.2
      WORKSPACE_DIR: /work
    mirror: upstream
    runtime:
      ssh:
        mode: password
    dependencies: []
    tests:
      - src/cuda/tests/smoke.sh
